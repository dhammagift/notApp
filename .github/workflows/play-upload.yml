name: Upload a release to Play

# Sends the NotApp.aab already attached to a GitHub release to Google Play - the same file, no
# rebuild. For a release that went to GitHub only (play unticked) and should reach Play later.
# Play refuses a versionCode it has already seen, so each release can go up once.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.6.5'
        required: true
        type: string
      track:
        description: 'Play track'
        required: false
        type: choice
        default: alpha
        options: [alpha, beta, production]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Get the release's bundle
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env, not interpolated into the script: a typed tag must not become shell code.
          TAG: ${{ inputs.tag }}
        # The mapping comes along where the release has one (from 0.6.7 on), so Play shows readable crashes.
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3, got: $TAG"
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern NotApp.aab --pattern NotApp-mapping.txt

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: gift.dhamma.noapp
          releaseFiles: NotApp.aab
          mappingFile: ${{ hashFiles('NotApp-mapping.txt') != '' && 'NotApp-mapping.txt' || '' }}
          track: ${{ inputs.track }}
          status: completed

      - name: Say what went to Play
        env:
          TAG: ${{ inputs.tag }}
          TRACK: ${{ inputs.track }}
        run: echo "### $TAG is on Play ($TRACK)" >> "$GITHUB_STEP_SUMMARY"
